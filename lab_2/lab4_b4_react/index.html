<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лабораторна робота №4 (Частина 1)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Моє резюме / Портфоліо</h1>
    <button id="themeToggleBtn" class="theme-btn">🌙 Нічний режим</button>
  </header>

  <main>
    <section class="reviews-section">
      <h2>Відгуки попередніх роботодавців</h2>
      <div id="commentsContainer">
        <p class="loading">Завантаження коментарів...</p>
      </div>
    </section>
  </main>

  <div id="modalOverlay" class="modal-overlay">
    <div class="modal-content">
      <button id="closeModalBtn" class="close-btn" title="Закрити">&times;</button>
      <h3>Форма зворотного зв'язку</h3>
      
      <form action="https://formspree.io/f/xkjjqqqn method="POST">
        <div class="form-group">
          <label for="name">Ім’я:</label>
          <input type="text" id="name" name="name" required placeholder="Ваше ім'я">
        </div>

        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required placeholder="name@example.com">
        </div>

        <div class="form-group">
          <label for="phone">Номер телефону:</label>
          <input type="tel" id="phone" name="phone" required placeholder="+380...">
        </div>

        <div class="form-group">
          <label for="message">Повідомлення:</label>
          <textarea id="message" name="message" rows="4" required placeholder="Ваше повідомлення..."></textarea>
        </div>

        <button type="submit" class="submit-btn">Надіслати</button>
      </form>
    </div>
  </div>

  <footer>
    <h3>Системна інформація:</h3>
    <div id="footerInfo">Зчитування даних...</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
